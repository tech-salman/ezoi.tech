<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Projects | ezoi tech</title>
  <link rel="stylesheet" href="../luxury.css" />
  <style>
    /* Additional custom styles to enhance the app list layout */
    .app-list {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      margin-top: 2rem;
      width: 100%;
      max-width: 450px;
    }
    
    .app-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 1.25rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      transition: transform 0.2s ease, background 0.2s ease;
    }

    .app-card:hover {
      background: rgba(255, 255, 255, 0.06);
      transform: translateY(-2px);
    }

    .app-info {
      text-align: left;
    }

    .app-info h3 {
      font-size: 1.1rem;
      font-weight: 600;
      margin: 0 0 0.25rem 0;
      color: inherit;
    }

    .app-info p {
      font-size: 0.85rem;
      opacity: 0.7;
      margin: 0;
    }

    .app-card button {
      white-space: nowrap;
      cursor: pointer;
    }

    @media (max-width: 480px) {
      .app-card {
        flex-direction: column;
        align-items: stretch;
        text-align: center;
      }
      .app-info {
        text-align: center;
      }
    }
  </style>
</head>
<body class="theme">
  <main class="hero">
    <div class="glass-panel">
      <p class="eyebrow">ezoi tech</p>
      <h1>Projects</h1>
      <p class="subtitle">Explore and download our latest Android applications.</p>
      
      <div class="app-list">
        <!-- Focado App -->
        <div class="app-card">
          <div class="app-info">
            <h3>Focado</h3>
            <p>Stay focused and boost your productivity.</p>
          </div>
          <a href="https://github.com/tech-salman/ezoi.tech/releases/download/v1.0.0/Focado.apk" rel="noopener noreferrer">
            <button type="button">Download</button>
          </a>
        </div>

        <!-- Reapiroo App -->
        <div class="app-card">
          <div class="app-info">
            <h3>Reapiroo</h3>
            <p>Version 1.70.152 available now.</p>
          </div>
          <a href="https://github.com/tech-salman/Reapiroo/releases/download/reapiroo/Reapiroo.v1.70.152.apk" rel="noopener noreferrer">
            <button type="button">Download</button>
          </a>
        </div>
      </div>

    </div>
  </main>
</body>
</html>
